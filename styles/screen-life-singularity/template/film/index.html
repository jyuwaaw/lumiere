<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:200;src:url(node_modules/@fontsource/inter/files/inter-latin-200-normal.woff2)}
@font-face{font-family:Inter;font-weight:300;src:url(node_modules/@fontsource/inter/files/inter-latin-300-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:JBM;font-weight:400;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-400-normal.woff2)}
@font-face{font-family:JBM;font-weight:500;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:JBM;font-weight:700;src:url(node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-700-normal.woff2)}
@font-face{font-family:NSerif;font-style:normal;src:url(node_modules/@fontsource/noto-serif/files/noto-serif-latin-400-normal.woff2)}
@font-face{font-family:NSerif;font-style:italic;src:url(node_modules/@fontsource/noto-serif/files/noto-serif-latin-400-italic.woff2)}

*{box-sizing:border-box}
html,body{margin:0;background:#000;width:1920px;height:1080px;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;perspective:2400px;perspective-origin:960px 540px;background:#000}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0;mix-blend-mode:screen}
.screen{position:absolute;left:0;top:0;width:2560px;height:1440px;transform-origin:0 0;display:none;overflow:hidden;
  background:#202124;font-family:Inter,'Noto Sans CJK SC',sans-serif;color:#e8eaed;font-size:24px;-webkit-font-smoothing:antialiased}
.ab{position:absolute}
.mono{font-family:JBM,'Noto Sans Mono CJK SC',monospace}
.serif{font-family:NSerif,'Noto Serif CJK SC',serif}

/* cursor */
#cur{position:absolute;width:44px;height:66px;z-index:999;pointer-events:none;transform-origin:4px 4px}

/* chrome window */
.cw{position:absolute;inset:0 0 72px 0;background:#202124;display:flex;flex-direction:column}
.cw-top{height:66px;background:#1b1b1d;display:flex;align-items:flex-end;padding-left:14px;position:relative;flex:none}
.cw-tabs{display:flex;align-items:flex-end;height:100%}
.tab{height:54px;width:340px;border-radius:14px 14px 0 0;display:flex;align-items:center;padding:0 18px;gap:14px;color:#c4c7c5;font-size:22px;white-space:nowrap;overflow:hidden;position:relative}
.tab.active{background:#35363a;color:#e8eaed}
.tab .fav{width:24px;height:24px;border-radius:50%;flex:none;background:#8ab4f8}
.tab .tt{flex:1;overflow:hidden;text-overflow:ellipsis}
.tab .x{opacity:.8;font-size:22px}
.tab:not(.active)::after{content:'';position:absolute;right:0;top:14px;height:26px;width:2px;background:#4a4b4f}
.cw-new{font-size:36px;color:#c4c7c5;padding:0 22px 8px}
.cw-btns{position:absolute;right:0;top:0;display:flex;height:50px}
.cw-btns span{width:86px;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:22px}
.cw-bar{height:72px;background:#35363a;display:flex;align-items:center;gap:22px;padding:0 20px;flex:none}
.cw-bar .nav{color:#c4c7c5;font-size:30px;width:36px;text-align:center}
.omni{flex:1;height:52px;border-radius:26px;background:#202124;display:flex;align-items:center;padding:0 22px;gap:18px;font-size:25px;color:#e8eaed;white-space:nowrap;overflow:hidden}
.omni .dim{color:#9aa0a6}
.avatar{width:40px;height:40px;border-radius:50%;background:#7c4dff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.cw-info{height:58px;background:#35363a;border-top:1px solid #4a4b4f;display:flex;align-items:center;padding:0 28px;gap:16px;font-size:23px;color:#e8eaed;flex:none}
.cw-page{flex:1;position:relative;overflow:hidden}

/* taskbar */
.tb{position:absolute;left:0;right:0;bottom:0;height:72px;background:rgba(32,32,36,.94);border-top:1px solid #3a3a3e;display:flex;align-items:center;justify-content:center;gap:10px}
.tb .ic{width:60px;height:60px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative}
.tb .ic.on::after{content:'';position:absolute;bottom:2px;left:24px;width:12px;height:5px;border-radius:3px;background:#9aa0a6}
.tb .ic.act::after{left:20px;width:20px;background:#60cdff}
.tb .srch{width:260px;height:48px;border-radius:24px;background:#3a3a3e;display:flex;align-items:center;gap:12px;padding-left:18px;color:#bbb;font-size:22px;margin:0 6px}
.tb .clock{position:absolute;right:70px;top:9px;text-align:right;font-size:19px;line-height:27px;color:#eee}
.tb .bell{position:absolute;right:22px;top:20px;color:#eee}

/* google */
.glogo{font-family:Inter;font-weight:500;letter-spacing:-3px;color:#fff}
.sb{position:absolute;background:#303134;border-radius:48px;display:flex;align-items:center;gap:22px;padding:0 34px;font-size:30px;color:#e8eaed}
.sb.open{border-radius:36px 36px 0 0;background:#303134}
.ph{color:#9aa0a6}
.comp{text-decoration:underline;text-decoration-color:#9aa0a6;text-underline-offset:8px}
.cw2{position:relative;display:inline-block;width:0;height:1em;vertical-align:-0.12em}
.caret{position:absolute;left:1px;top:-0.08em;width:2.5px;height:1.2em;background:#e8eaed}
.cand{position:absolute;left:-10px;top:1.9em;background:#2c2c2c;border:1px solid #444;border-radius:12px;display:flex;align-items:center;gap:34px;padding:16px 26px;white-space:nowrap;font-size:30px;color:#ddd;box-shadow:0 16px 40px rgba(0,0,0,.6);z-index:50;text-decoration:none}
.cand .sel{position:relative;color:#fff}
.cand .sel::before{content:'';position:absolute;left:-14px;top:5px;width:4px;height:30px;border-radius:2px;background:#60cdff}
.cand .n{color:#aaa;margin-right:10px;font-size:26px}
.sugg{position:absolute;background:#303134;border-radius:0 0 36px 36px;padding:6px 0 26px;border-top:1px solid #5f6368}
.sugg div{height:62px;display:flex;align-items:center;gap:26px;padding:0 34px;font-size:28px;color:#e8eaed}
.sugg div.hl{background:#3c4043}
.sugg .g{color:#9aa0a6;font-size:24px}

/* results */
.res{position:absolute;left:0;right:0;top:0;bottom:0}
.rhead{height:150px;display:flex;align-items:center;gap:50px;padding-left:44px}
.rtabs{display:flex;gap:46px;padding-left:300px;font-size:24px;color:#bdc1c6;height:56px;align-items:flex-start;border-bottom:1px solid #3c4043}
.rtabs .on{color:#8ab4f8;border-bottom:4px solid #8ab4f8;padding-bottom:12px}
.rbody{padding-left:300px;width:1500px}
.stat{font-size:22px;color:#9aa0a6;margin:26px 0 36px}
.r{margin-bottom:46px}
.r .site{font-size:23px;color:#dadce0;display:flex;gap:16px;align-items:center}
.r .site .fv{width:40px;height:40px;border-radius:50%;background:#e8eaed;color:#202124;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;flex:none}
.r .url{font-size:19px;color:#bdc1c6}
.r .ttl{font-size:33px;color:#8ab4f8;margin:12px 0 8px}
.r .sn{font-size:23px;color:#bdc1c6;line-height:38px}
.r .meta{font-size:21px;color:#9aa0a6;margin-bottom:6px}

/* wiki */
.wk{position:absolute;inset:0;background:#fff;color:#202122;padding:60px 0 0 260px;font-family:'Noto Sans CJK SC',Inter,sans-serif}
.wk h1{font-family:'Noto Serif CJK SC',serif;font-weight:400;font-size:54px;margin:0 0 6px;border-bottom:1px solid #a2a9b1;width:1900px;padding-bottom:10px}
.wk .sub{font-size:22px;color:#54595d;margin-bottom:30px}
.wk p{font-size:27px;line-height:46px;width:1900px;margin:0 0 26px}
.wk a{color:#3366cc;text-decoration:none}
.wk table{border-collapse:collapse;font-size:26px;margin:10px 0 30px}
.wk td,.wk th{border:1px solid #a2a9b1;padding:12px 26px;text-align:center}
.wk th{background:#eaecf0}
.wk .y{background:#9f9;}
.wk .n{background:#ffc7c7}
.wk .q{background:#ffc7c7;color:#a00}
.wk sup{color:#3366cc;font-size:18px}

/* claude */
.cl{position:absolute;inset:0 0 72px 0;background:#262624;color:#f0eee6;font-family:Inter,'Noto Sans CJK SC',sans-serif}
.cl .side{position:absolute;left:0;top:0;bottom:0;width:380px;background:#1f1e1d;border-right:1px solid #33322f;padding:40px 30px;font-size:24px;color:#c2c0b6}
.cl .side div{padding:14px 18px;border-radius:12px}
.cl .greet{position:absolute;left:760px;width:1400px;top:420px;text-align:center;font-family:'Noto Serif CJK SC',serif;font-size:66px;color:#f0eee6;display:flex;justify-content:center;align-items:center;gap:30px}
.cl .compo{position:absolute;left:760px;width:1400px;top:580px;height:220px;background:#30302e;border:1px solid #45443f;border-radius:30px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.cl .compo .inp{position:absolute;left:40px;top:38px;right:40px;font-size:32px;color:#f0eee6}
.cl .compo .ph{color:#8e8c84}
.cl .crow{position:absolute;left:28px;right:28px;bottom:24px;height:60px;display:flex;align-items:center;gap:20px;color:#c2c0b6;font-size:24px}
.cl .btn{height:56px;border:1px solid #45443f;border-radius:14px;display:flex;align-items:center;padding:0 18px;gap:10px}
.cl .model{margin-left:auto;font-size:25px;color:#e8e6dc;display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:12px}
.cl .send{width:60px;height:60px;border-radius:14px;background:#c96442;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px}
.dd{position:absolute;width:760px;background:#30302e;border:1px solid #4a4944;border-radius:24px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.dd .it{padding:20px 26px;border-radius:16px;position:relative}
.dd .it.hv{background:#3c3b37}
.dd .nm{font-size:30px;color:#f0eee6;display:flex;align-items:center;gap:20px}
.dd .ds{font-size:23px;color:#a3a198;margin-top:8px}
.dd .ck{position:absolute;right:30px;top:36px;color:#d97757;font-size:30px}
.badge{font-size:22px;padding:5px 16px;border-radius:20px;background:rgba(217,119,87,.18);color:#f0a184;border:1px solid rgba(217,119,87,.45)}
.dd hr{border:0;border-top:1px solid #45443f;margin:10px 16px}
.thread{position:absolute;left:880px;width:1160px;top:150px}
.ubub{margin-left:auto;width:max-content;max-width:900px;background:#141413;border-radius:22px;padding:22px 30px;font-size:30px;color:#f0eee6}
.ans{margin-top:56px;font-size:31px;line-height:56px;color:#f0eee6;font-family:'Noto Serif CJK SC',NSerif,serif}
.ans p{margin:0 0 30px}
.ans .dm{text-align:center;font-size:40px;margin:16px 0 40px;color:#fff}
.ans .muted{color:#a3a198}
.ans .small{font-size:24px;color:#a3a198;font-family:Inter,'Noto Sans CJK SC',sans-serif;line-height:40px}
.m{font-family:NSerif,serif;font-style:italic}
.m .u{font-style:normal}
.think{font-size:25px;color:#a3a198;font-family:Inter,'Noto Sans CJK SC',sans-serif}
.think b{color:#c2c0b6;font-weight:500}

/* uac */
.uac{position:absolute;left:820px;top:250px;width:920px;background:#2b2b2b;border:1px solid #4a4a4a;border-radius:14px;box-shadow:0 30px 120px rgba(0,0,0,.7);overflow:hidden;font-family:Inter,'Noto Sans CJK SC',sans-serif}
.uac .hd{background:#1f1f1f;padding:18px 34px;font-size:21px;color:#ccc}
.uac .bd{padding:30px 44px;color:#eee}
.uac h2{font-size:38px;font-weight:600;margin:4px 0 34px;line-height:54px}
.uac .app{display:flex;gap:22px;align-items:center;margin-bottom:26px}
.uac .app .n1{font-size:28px;font-weight:600}
.uac .app .n2{font-size:21px;color:#aaa;margin-top:4px}
.uac .kv{font-size:23px;line-height:40px;color:#ddd}
.uac .perm{margin:22px 0 10px;font-size:23px;line-height:44px;color:#ddd}
.uac .perm div::before{content:'✓';color:#60cdff;margin-right:16px}
.uac .more{color:#60cdff;font-size:22px;margin:16px 0 30px}
.uac .bts{display:flex;gap:20px;padding:0 44px 40px}
.uac .bts div{flex:1;height:66px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px}
.uac .yes{background:#60cdff;color:#000}
.uac .no{background:#3a3a3a;color:#eee}

/* banner */
.bn{position:absolute;left:50%;transform:translateX(-50%);top:16px;height:78px;border-radius:39px;background:rgba(30,29,27,.92);border:1.5px solid rgba(217,119,87,.75);box-shadow:0 0 50px rgba(217,119,87,.35),0 10px 40px rgba(0,0,0,.5);display:flex;align-items:center;gap:30px;padding:0 14px 0 30px;font-size:27px;color:#f0eee6;white-space:nowrap;z-index:60}
.bn .ct{color:#c2c0b6;font-variant-numeric:tabular-nums}
.bn .stop{background:#3c3b37;border-radius:30px;padding:12px 30px;color:#fff}

/* wall */
.mw{position:absolute;width:600px;height:340px;background:#202124;border:1px solid #3c3c40;border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.mw .bar{height:34px;background:#2d2e31;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;color:#ccc;white-space:nowrap;overflow:hidden}
.mw .pg{position:absolute;top:34px;left:0;right:0;bottom:0;padding:14px 18px;overflow:hidden;font-size:15px;line-height:22px}
.ln{height:9px;border-radius:4px;margin:8px 0}

/* paper */
.pp{position:absolute;inset:0;background:#fff;color:#1a1a1a;font-family:NSerif,serif}
.pp .blk{position:absolute;left:520px;width:1520px;font-size:34px;line-height:58px;text-align:justify}
.pp h3{font-size:44px;font-weight:400;margin:0 0 20px}
.pp mark{background:#ffd54a;color:#000;border-radius:3px}
.pp mark.cur{background:#ff9632}
.pp .gr{color:#5a5a5a;font-size:26px;font-family:Inter,sans-serif}
.find{position:absolute;right:120px;top:0px;width:820px;height:86px;background:#35363a;border-radius:0 0 18px 18px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;align-items:center;gap:26px;padding:0 30px;font-size:30px;color:#e8eaed;font-family:Inter,sans-serif;z-index:20}
.find .q{flex:1}
.find .c{color:#9aa0a6}

/* notepad */
.np{position:absolute;left:380px;top:120px;right:0;bottom:72px;background:#272727;border:1px solid #3b3b3b;border-radius:14px 0 0 0;overflow:hidden}
.np .tl{height:76px;background:#1f1f1f;display:flex;align-items:center;padding-left:30px;gap:16px;font-size:23px;color:#ddd}
.np .mn{height:60px;display:flex;align-items:center;gap:52px;padding-left:34px;font-size:25px;color:#ddd;border-bottom:1px solid #333}
.np .tx{padding:36px 40px;font-size:46px;line-height:80px;color:#f2f2f2;white-space:pre-wrap;font-family:'Noto Sans Mono CJK SC',JBM,monospace}

/* terminal */
.wt{position:absolute;inset:0 0 72px 0;background:#0c0c0c}
.wt .tl{height:70px;background:#1e1e1e;display:flex;align-items:flex-end;padding-left:16px}
.wt .tl .t{height:56px;width:380px;background:#0c0c0c;border-radius:12px 12px 0 0;display:flex;align-items:center;gap:14px;padding-left:20px;font-size:22px;color:#ddd}
.wt .body{position:absolute;left:30px;right:30px;top:96px;bottom:20px;font-size:31px;line-height:44px;color:#cccccc;white-space:pre;overflow:hidden}
.c-g{color:#16c60c}.c-y{color:#f9f1a5}.c-b{color:#3b78ff}.c-c{color:#61d6d6}.c-d{color:#767676}.c-w{color:#f2f2f2}.c-o{color:#e58a63}.c-r{color:#e74856}
.hlrow{background:rgba(97,214,214,.12)}
</style></head>
<body>
<div id="stage"></div>
<div id="flash"></div>
<div id="fade"></div>
<script src="spectrum.js"></script>
<script src="film.js"></script>
</body></html>
